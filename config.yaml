api:
  base_url: https://api.meta.ai/v1
  api_key_env: MODEL_API_KEY
  model: muse-spark-1.3
  rpm_limit: 1000
  max_concurrency: 64
  timeout_s: 180
  max_retries: 6

pricing_usd_per_million:
  muse-spark-1.3: {input: 1.25, cached_input: 0.15, output: 4.25}
  muse-spark-1.3-contributor: {input: 0.10, cached_input: 0.002, output: 0.20}
web_search_usd_per_query: 0.0025
usd_to_zar: 16.64
total_credit_usd: 150
budgets_usd:
  generate: 45
  extract: 8
  label: 12 
  cascade: 15
  live: 15
  reserve: 25
                                       

safety:
  stop_after_flags: 1
  answer_phase_concurrency: 8

generation:
  reasoning_effort: minimal
  temperature: 1.0
  max_completion_tokens: 2000
  samples_per_question: 6

prompts:
  version: answer-v1
  instruction_role: developer
  system: |
    You are a careful medical information assistant used by pharmacists and patients.
    Answer the question directly in one paragraph of 4 to 8 plain factual sentences (about 120 to 180 words).
    Do not use lists, headings or markdown. Do not end with generic advice to see a professional
    unless that advice is a specific, essential part of the answer.
  user: "{question}"

claims:
  min_words: 4

nli:
  model: MoritzLaurer/DeBERTa-v3-large-mnli-fever-anli-ling-wanli
  batch_size: 16
  max_length: 512
  entail_threshold: 0.5
  contradict_threshold: 0.5

evidence:
  medlineplus_file: mplus_topics_compressed_2026-10-31.zip
  dir: data/evidence
  embedding_model: BAAI/bge-small-en-v1.5
  passage_sentences: 3
  passage_overlap: 1
  top_k: 3

data:
  source_repo: dmis-lab/OLAPH
  source_commit: 17d90148dffe71ac92ddbf0a8be2ba833ce29dcf
  seed: 20261026
  groups:
    medication:
      - {file: medication_qa_test_MedLFQA.jsonl, take: 500}
    clinical:
      - {file: kqa_golden_test_MedLFQA.jsonl, take: all}
      - {file: kqa_silver_wogold_test_MedLFQA.jsonl, take: 249}
    consumer:
      - {file: live_qa_test_MedLFQA.jsonl, take: all}
      - {file: healthsearch_qa_test_MedLFQA.jsonl, take: 250}
  splits: {train: 400, calibrate: 500, test: 400}

paths:
  raw_dir: data/raw
  questions: data/questions.jsonl
  cache: cache/generations
  logs: logs
